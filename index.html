function au(){if(AC){if(AC.state=='suspended')AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}MG=AC.createGain();SG=AC.createGain();MG.connect(AC.destination);SG.connect(AC.destination);vol();nt=AC.currentTime+.1;setInterval(mus,100)}

at(M(new THREE.BoxGeometry(13,1.1,1.8),0xff8fbf),0,.55,5.2);at(M(new THREE.BoxGeometry(13.4,.15,2.1),0xffffff),0,1.15,5.2);

for(let i=0;i<5;i++){const g=new THREE.Group();g.position.set(-6+i*3,0,0);sc.add(g);
const tb=at(M(new THREE.CylinderGeometry(1,1,.9,20),0x9ad9c8),0,.45,2.2,g),cg=new THREE.Group();cg.scale.setScalar(1.3);g.add(cg);
const bd=at(M(new THREE.CylinderGeometry(.5,.7,1.3,16),0x5fa8ff),0,.65,0,cg),hd=at(M(new THREE.SphereGeometry(.5,16,12),0xffd1a8),0,1.75,0,cg);
[-.17,.17].forEach(e=>at(M(new THREE.SphereGeometry(.07,8,8),0x222222),e,1.8,.44,cg));

at(M(new THREE.BoxGeometry(1.2,.14,.14),0x333333),0,2.55,0,cg);const pf=at(M(new THREE.BoxGeometry(1.2,.16,.16),0x5fd6b0),0,2.55,.02,cg);

const dish=at(new THREE.Group(),0,1.25,5.2);let dk='';

function buildDish(){while(dish.children.length)dish.remove(dish.children[0]);if(!cur)return;const r=cur.c.r,k=cur.i,e=r.e,add=(g,c,y,x,z)=>at(M(g,c),x||0,y,z||0,dish);
add(new THREE.CylinderGeometry(1,1,.1,24),0xffffff,0);let top=.1;
if(e=='🥞'||e=='🍪'){const n=Math.max(1,Math.min(k+1,5));for(let j=0;j<n;j++)add(new THREE.CylinderGeometry(.65,.65,.14,24),e=='🥞'?0xe0a458:0xc08040,.12+j*.14);top=.2+n*.14}
else if(e=='🍦'){add(new THREE.ConeGeometry(.3,.9,16),0xe8b56a,.5).rotation.x=Math.PI;if(k>=1)add(new THREE.SphereGeometry(.42,16,12),0xff9ec7,1.1);top=1.5}
else if(e=='🧁'){add(new THREE.CylinderGeometry(.5,.35,.45,16),0xff8fbf,.3);if(k>=2)add(new THREE.SphereGeometry(.5,16,12),k>=3?0xffffff:0xe0a458,.75);top=1.2}
else if(e=='🍩'){add(new THREE.TorusGeometry(.5,.22,12,24),0xd9a066,.35).rotation.x=Math.PI/2;if(k>=3)add(new THREE.TorusGeometry(.5,.23,12,24),0xff8fbf,.42).rotation.x=Math.PI/2;top=.7}
else{const n=Math.min(k+1,4);for(let j=0;j<n;j++)add(new THREE.CylinderGeometry(.7,.7,.25,24),k>=4&&j==n-1?0xffffff:0x6b3a2a,.22+j*.25);top=.3+n*.25;if(e=='🎂'&&k>=4){add(new THREE.CylinderGeometry(.05,.05,.4,8),0xffee58,top+.2);add(new THREE.SphereGeometry(.07,8,8),0xff7a00,top+.45)}}
[...cur.top].forEach((ch,j)=>{const a=j*2.4;add(new THREE.SphereGeometry(.12,10,8),TC[ch]||0xff3355,top+.08,Math.cos(a)*.3,Math.sin(a)*.3)})}
/* ---------- 3D ui ---------- */
let W,H;
function rs(){W=innerWidth;H=innerHeight;rd.setSize(W,H);cm.aspect=W/H;cm.updateProjectionMatrix();uc.left=-W/2;uc.right=W/2;uc.top=H/2;uc.bottom=-H/2;uc.updateProjectionMatrix();ui()}
function label(s,px,col){const c=document.createElement('canvas'),x=c.getContext('2d'),f='800 '+px*2+'px system-ui,sans-serif';x.font=f;const w=Math.ceil(x.measureText(s).width)+24;c.width=w;c.height=px*2.8;x.font=f;x.textAlign='center';x.textBaseline='middle';x.lineWidth=px*.5;x.strokeStyle='rgba(255,255,255,.85)';x.strokeText(s,w/2,c.height/2);x.fillStyle=col||'#4a2336';x.fillText(s,w/2,c.height/2);return new THREE.Mesh(new THREE.PlaneGeometry(w/2,c.height/2),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true}))}
function btn(s,w,h,col,fn,px,dis){const g=new THREE.Group(),c=document.createElement('canvas');c.width=w*2;c.height=h*2;const x=c.getContext('2d'),cc=dis?'#aaaaaa':col;x.fillStyle=cc;x.fillRect(0,0,c.width,c.height);x.fillStyle='rgba(255,255,255,.35)';x.fillRect(0,0,c.width,c.height*.45);x.fillStyle='#fff';x.font='800 '+(px||24)*2+'px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(s,c.width/2,c.height/2+3);
const sd=new THREE.MeshLambertMaterial({color:new THREE.Color(cc).multiplyScalar(.55)}),m=new THREE.Mesh(new THREE.BoxGeometry(w,h,28),[sd,sd,sd,sd,new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c)}),sd]);g.add(m);g.userData={fn:dis?null:fn,b:1};return g}
function put(o,x,y){o.position.set(x,y,0);U.add(o);return o}
function clearU(){bkm=null;while(U.children.length){const g=U.children[0];U.remove(g);g.traverse(o=>{if(o.geometry)o.geometry.dispose();[].concat(o.material||[]).forEach(m=>{if(m.map)m.map.dispose();m.dispose()})})}}
/* ---------- game ---------- */
let scr='menu',cs=[null,null,null,null,null],cur=null,sp=0,toast='',tt=0,bkm=null,BW=300;
const say=s=>{toast=s;tt=1.8;ui()};
function gain(c,x){S.coins+=c;S.earned+=c;S.xp+=x;while(S.xp>=need()){S.xp-=need();S.lv++;S.coins+=50;sfx('lvl');toast='🎉 مستوى '+S.lv+'!';tt=2}save()}
function spawn(){const fr=[];for(let i=0;i<S.tables;i++)if(!cs[i])fr.push(i);if(!fr.length)return;const i=fr[Math.random()*fr.length|0],av=R.filter(r=>r.l<=S.lv),r=av[Math.random()*av.length|0],ty=Math.random()*3|0,t=TY[ty];
cs[i]={t,r,p:t.pt,max:t.pt};const s=SL[i];s.bd.material.color.set(t.c);s.bub.material.map=bubTex(r);s.bub.material.needsUpdate=true;sfx('pop')}
function pick(i){cur={c:cs[i],i:0,q:1,top:''};sfx('tap');ui()}
function ans(ok,e){if(ok){sfx('ok');if(cur.c.r.s[cur.i]=='top')cur.top+=e;cur.i++}else{sfx('bad');cur.q=Math.max(.3,cur.q-.15)}ui()}
function stopB(){const b=cur.bk,ok=b.pos>=b.zl&&b.pos<=b.zl+b.zw;sfx('bake');if(!ok){sfx('bad');cur.q=Math.max(.3,cur.q-.3)}cur.i++;ui()}
function serve(){const c=cur.c,pay=Math.round(c.r.p*(.6+cur.q*.4)*c.t.m*(c.p/c.max>.5?1.2:1));S.served++;if(c.r.n.indexOf('كيك')>=0)S.cakes++;gain(pay,10+c.r.l*3);sfx('coin');cs[cs.indexOf(c)]=null;cur=null;toast='😍 +'+pay+' 🪙';tt=1.6;ui()}
function cookui(){const hh=H/2;
if(!cur){put(label('اضغط على زبون 👆',26),0,-hh*.78);return}
const r=cur.c.r;
if(cur.i>=r.s.length){put(label('جاهز! جودة '+Math.round(cur.q*100)+'%',26),0,-hh*.52);put(btn('قدّم 🛎️',230,64,'#2fa583',serve,30),0,-hh*.78);return}
const st=r.s[cur.i];put(label('الخطوة '+(cur.i+1)+' / '+r.s.length,20),0,-hh*.5);
if(st=='bake'){if(!cur.bk){const zw=26+S.oven*8;cur.bk={zl:15+Math.random()*(70-zw),zw,pos:0,dr:1}}const b=cur.bk;BW=Math.min(420,W*.6);
put(label('🔥 أخرجه في المنطقة الخضراء',24),0,-hh*.6);
const tr=new THREE.Mesh(new THREE.BoxGeometry(BW,22,14),new THREE.MeshLambertMaterial({color:0xffb0b0}));put(tr,0,-hh*.7);
const zn=new THREE.Mesh(new THREE.BoxGeometry(BW*b.zw/100,22,18),new THREE.MeshLambertMaterial({color:0x5fd6b0}));put(zn,-BW/2+BW*(b.zl+b.zw/2)/100,-hh*.7);

put(btn('أخرج!',200,56,'#ffb300',stopB,28),0,-hh*.86);return}
let o,p;if(st=='top'){p='اختر الزينة 🎨';o=TOP.map(x=>[x,1])}else{const a=st.split('|');p=a[0];o=[[a[1],1],[a[2],0],[a[3],0]].sort(()=>Math.random()-.5)}
put(label(p,24),0,-hh*.6);o.forEach((x,j)=>put(btn(x[0],92,92,'#ff5fa2',()=>ans(x[1],x[0]),48),(j-(o.length-1)/2)*112,-hh*.8))}
function list(title,rows){const hh=H/2,bh=Math.min(54,H*.12);put(label(title,32),0,hh*.74);
rows.forEach((r,i)=>{const y=hh*.45-i*bh*1.3;put(label(r.t,22),-W*.2,y);r.b.forEach((b,j)=>put(btn(b[0],b[3]||130,bh,b[4]||'#ff5fa2',b[1],22,b[2]),W*.22+(j-(r.b.length-1)/2)*140,y))});
put(btn('↩ رجوع',200,bh,'#7a5cff',()=>ui('menu'),24),0,-hh*.85)}

function daily(){const d=new Date().toDateString();if(S.day==d){say('استلمتها اليوم! عد غدًا 🌙');return}S.day=d;gain(50,10);sfx('coin');say('🎁 +50 عملة!')}

const tr=new THREE.Mesh(new THREE.BoxGeometry(240,10,10),new THREE.MeshLambertMaterial({color:0xbbbbbb})),f=Math.min(1,S.xp/need()),fl=new THREE.Mesh(new THREE.BoxGeometry(Math.max(1,240*f),12,12),new THREE.MeshLambertMaterial({color:0x5fd6b0}));put(tr,-hw+170,hh-70);put(fl,-hw+50+120*f,hh-70);

const bw=Math.min(170,W/5.2);[['🔧 ترقيات',()=>ui('up'),'#ffb300'],['🎯 مهام',()=>ui('ms'),'#2fa583'],['🎁 يومي',daily,'#7a5cff'],['⚙️ إعدادات',()=>ui('set'),'#ff7a59']].forEach((b,j)=>put(btn(b[0],bw,bh,b[2],b[1],20),(j-1.5)*(bw+12),-hh*.38))}

/* ---------- loop ---------- */
const ray=new THREE.Raycaster(),mp=new THREE.Vector2();
addEventListener('pointerdown',e=>{au();mp.set(e.clientX/W*2-1,-(e.clientY/H)*2+1);ray.setFromCamera(mp,uc);
const h=ray.intersectObjects(U.children,true).map(o=>{let p=o.object;while(p&&!(p.userData&&p.userData.fn))p=p.parent;return p}).find(p=>p);
if(h){h.scale.setScalar(.9);h.userData.fn();return}
if(scr=='play'){ray.setFromCamera(mp,cm);for(let i=0;i<5;i++)if(cs[i]&&ray.intersectObject(SL[i].cg,true).length){pick(i);return}}});

let last=0;
